<app-expired *ngIf="loanService.isExpired()"></app-expired>
<ng-container *ngIf="!loanService.isExpired()">
  <app-settings *ngIf="currentScreen() === 'settings'" (goBack)="currentScreen.set('dashboard')"></app-settings>
  <app-dashboard *ngIf="currentScreen() === 'dashboard'" (openSettings)="currentScreen.set('settings')"></app-dashboard>
</ng-container>
